rames": [{"name": "全局", "vars": {}}], "out": ""}, {"line": 2, "frames": [{"name": "全局", "vars": {"total": "86.0"}}], "out": "合计：86\n"}, {"line": 3, "frames": [{"name": "全局", "vars": {"total": "86.0", "member": "'n'"}}], "out": "合计：86\n会员？(y/n)：n\n"}, {"line": 4, "frames": [{"name": "全局", "vars": {"total": "86.0", "member": "'n'", "pay": "86.0"}}], "out": "合计：86\n会员？(y/n)：n\n"}, {"line": 7, "frames": [{"name": "全局", "vars": {"total": "86.0", "member": "'n'", "pay": "86.0"}}], "out": "合计：86\n会员？(y/n)：n\n"}, {"line": 8, "frames": [{"name": "全局", "vars": {"total": "86.0", "member": "'n'", "pay": "86.0"}}], "out": "合计：86\n会员？(y/n)：n\n还差 14.0 元满减\n"}, {"line": 10, "frames": [{"name": "全局", "vars": {"total": "86.0", "member": "'n'", "pay": "86.0"}}], "out": "合计：86\n会员？(y/n)：n\n还差 14.0 元满减\n"}, {"line": null, "frames": [{"name": "全局", "vars": {"total": "86.0", "member": "'n'", "pay": "86.0"}}], "out": "合计：86\n会员？(y/n)：n\n还差 14.0 元满减\n实付 86.0\n"}]}, "notes": {"1": "输入合计 86。", "2": "输入 n。", "3": "先假设实付等于原价。", "4": "判断 86 >= 100，结果是 False，跳过 if 下面的那一行，直接去 else。", "7": "执行 else 里的那一行，提示还差多少钱。", "8": "判断 member == \"y\"，结果是 False，跳过打折那一行。", "10": "显示结果：没有任何优惠。"}}, {"title": "等级：75 分", "trace": {"code": ["score = int(input(\"成绩：\"))", "if score >= 90:", "    level = \"优秀\"", "elif score >= 80:", "    level = \"良好\"", "elif score >= 70:", "    level = \"中等\"", "elif score >= 60:", "    level = \"及格\"", "else:", "    level = \"不及格\"", "print(\"等级：\", level)"], "steps": [{"line": 1, "frames": [{"name": "全局", "vars": {}}], "out": ""}, {"line": 2, "frames": [{"name": "全局", "vars": {"score": "75"}}], "out": "成绩：75\n"}, {"line": 4, "frames": [{"name": "全局", "vars": {"score": "75"}}], "out": "成绩：75\n"}, {"line": 6, "frames": [{"name": "全局", "vars": {"score": "75"}}], "out": "成绩：75\n"}, {"line": 7, "frames": [{"name": "全局", "vars": {"score": "75"}}], "out": "成绩：75\n"}, {"line": 12, "frames": [{"name": "全局", "vars": {"score": "75", "level": "'中等'"}}], "out": "成绩：75\n"}, {"line": null, "fra
