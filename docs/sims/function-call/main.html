<!doctype html>
<html lang="zh">
<head>

<body>
<h1>函数调用与返回</h1>
<div class="sub">点“下一步”，看调用函数时程序怎样“跳进”函数、参数怎样传进去、return 怎样把结果带回来。右边变量表里，“全局”是主程序的变量，下面多出来的一块是函数自己的局部变量，函数返回后就消失。</div>
<div id="stepper"></div>

<script src="../common/stepper.js"></script>
<script>
// 以下数据由 tools/make_stepper_sim.py 根据 spec.json 真实运行代码生成，请勿手改
var PROGRAMS = [{"title": "调用两次 discount", "trace": {"code": ["def discount(total, member):", "    pay = total", "    if total >= 100:", "        pay = pay - 15", "    if member:", "        pay = pay * 0.95", "    return round(pay, 2)", "", "a = discount(128, True)", "b = discount(86, False)", "print(a, b)"], "steps": [{"line": 1, "frames": [{"name": "全局", "vars": {}}], "out": ""}, {"line": 9, "frames": [{"name": "全局", "vars": {"discount": "函数 discount"}}], "out": ""}, {"line": 2, "frames": [{"name": "全局", "vars": {"discount": "函数 discount"}}, {"name": "discount()", "vars": {"total": "128", "member": "True"}}], "out": ""}, {"line": 3, "frames": [{"name": "全局", "vars": {"discount": "函数 discount"}}, {"name": "discount()", "vars": {"total": "128", "member": "True", "pay": "128"}}], "out": ""}, {"line": 4, "frames": [{"name": "全局", "vars": {"discount": "函数 discount"}}, {"name": "discount()", "vars": {"total": "128", "member": "True", "pay": "128"}}], "out": ""}, {"line": 5, "frames": [{"name": "全局", "vars": {"discount": "函数 discount"}}, {"name": "discount()", "vars": {"total": "128", "member": "True", "pay": "113"}}], "out": ""}, {"line": 6, "frames": [{"name": "全局", "vars": {"discount": "函数 discount"}}, {"name": "discount()", "vars": {"total": "128", "member": "True", "pay": "113"}}], "out": ""}, {"line": 7, "frames": [{"name": "全局", "vars": {"discount": "函数 discount"}}, {"name": "discount()", "vars": {"total": "128", "member": "True", "pay": "107.35"}}], "out": ""}, {"line": 7, "frames": [{"name": "全局", "vars": {"discount": "函数 discount"}}, {"name": "discount()", "vars": {"total": "128", "member": "True", "pay": "107.35"}}], "out": "", "ret": "107.35"}, {"line": 10, "frames": [{"name": "全局", "vars": {"discount": "函数 discount", "a": "107.35"}}], "out": ""}, {"line": 2, "frames": [{"name": "全局", "vars": {"discount": "函数 discount", "a": "107.35"}}, {"name": "discount()", "vars": {"total": "86", "member": "False"}}], "out": ""}, {"line": 3, "frames": [{"name": "全局", "vars": {"discount": "函数 discount", "a": "107.35"}}, {"name": "discount()", "vars": {"total": "86", "member": "False", "pay": "86"}}], "out": ""}, {"line": 5, "frames": [{"name": "全局", "vars": {"discount": "函数 discount", "a": "107.35"}}, {"name": "discount()", "vars": {"total": "86", "member": "False", "pay": "86"}}], "out": ""}, {"line": 7, "frames": [{"name": "全局", "vars": {"discount": "函数 discount", "a": "107.35"}}, {"name": "discount()", "vars": {"total": "86", "member": "False", "pay": "86"}}], "out": ""}, {"line": 7, "frames": [{"name": "全局", "vars": {"discount": "函数 discount", "a": "107.35"}}, {"name": "discount()", "vars": {"total": "86", "member": "False", "pay": "86"}}], "out": "", "ret": "86"}, {"line": 11, "frames": [{"name": "全局", "vars": {"discount": "函数 discount", "a": "107.35", "b": "86"}}], "out": ""}, {"line": null, "frames": [{"name": "全局", "vars": {"discount": "函数 discount", "a": "107.35", "b": "86"}}], "out": "107.35 86\n"}]}, "notes": {"1": "def 只是“定义”函数，把这几行代码打包起来，现在一行都不执行。", "9": "调用 discount(128, True)：程序跳进函数，128 传给 total，True 传给 member。", "2": "进入函数：右边多了一块 discount() 的局部变量。", "3": "判断是否满 100。", "4": "满减。", "5": "判断是否会员。", "6": "打 9.5 折。", "7": "return 把结果带回调用的地方，函数的局部变量随之消失。", "10": "第二次调用，同一段代码换一组参数再执行一遍。", "11": "显示两次调用的结果。"}}, {"title": "局部变量与全局变量", "trace": {"code": ["rate = 0.9", "", "def price(p):", "    rate = 0.8", "    result = p * rate", "    return result", "", "x = price(10)", "print(x, rate)"], "steps": [{"line": 1, "frames": [{"name": "全局", "vars": {}}], "out": ""}, {"line": 3, "frames": [{"name": "全局", "vars": {"rate": "0.9"}}], "out": ""}, {"line": 8, "frames": [{"name": "全局", "vars": {"rate": "0.9", "price": "函数 price"}}], "out": ""}, {"line": 4, "frames": [{"name": "全局", "vars": {"rate": "0.9", "price": "函数 price"}}, {"name": "price()", "vars": {"p": "10"}}], "out": ""}, {"line": 5, "frames": [{"name": "全局", "vars": {"rate": "0.9", "price": "函数 price"}}, {"name": "price()", "vars": {"p": "10", "rate": "0.8"}}], "out": ""}, {"line": 6, "frames": [{"name": "全局", "vars": {"rate": "0.9", "price": "函数 price"}}, {"name": "price()", "vars": {"p": "10", "rate": "0.8", "result": "8.0"}}], "out": ""}, {"line": 6, "frames": [{"name": "全局", "vars": {"rate": "0.9", "price": "函数 price"}}, {"name": "price()", "vars": {"p": "10", "rate": "0.8", "result": "8.0"}}], "out": "", "ret": "8.0"}, {"line": 9, "frames": [{"name": "全局", "vars": {"rate": "0.9", "price": "函数 price", "x": "8.0"}}], "out": ""}, {"line": null, "frames": [{"name": "全局", "vars": {"rate": "0.9", "price": "函数 price", "x": "8.0"}}], "out": "8.0 0.9\n"}]}, "notes": {"1": "全局变量 rate = 0.9。", "3": "定义函数 price。", "8": "调用 price(10)。", "4": "函数里的 rate = 0.8 是一个新的局部变量，和外面的 rate 同名但互不相干。", "5": "这里用的是局部的 rate（0.8）。", "6": "返回 8.0，局部变量全部消失。", "9": "外面的 rate 还是 0.9，没有被函数改掉。"}}, {"title": "递归：fact(3)", "trace": {"code": ["def fact(n):", "    if n == 1:", "        return 1", "    return n * fact(n - 1)", "", "r = fact(3)", "print(r)"], "steps": [{"line": 1, "frames": [{"name": "全局", "vars": {}}], "out": ""}, {"line": 6, "frames": [{"name": "全局", "vars": {"fact": "函数 fact"}}], "out": ""}, {"line": 2, "frames": [{"name": "全局", "vars": {"fact": "函数 fact"}}, {"name": "fact()", "vars": {"n": "3"}}], "out": ""}, {"line": 4, "frames": [{"name": "全局", "vars": {"fact": "函数 fact"}}, {"name": "fact()", "vars": {"n": "3"}}], "out": ""}, {"line": 2, "frames": [{"name": "全局", "vars": {"fact": "函数 fact"}}, {"name": "fact()", "vars": {"n": "3"}}, {"name": "fact()", "vars": {"n": "2"}}], "out": ""}, {"line": 4, "frames": [{"name": "全局", "vars": {"fact": "函数 fact"}}, {"name": "fact()", "vars": {"n": "3"}}, {"name": "fact()", "vars": {"n": "2"}}], "out": ""}, {"line": 2, "frames": [{"name": "全局", "vars": {"fact": "函数 fact"}}, {"name": "fact()", "vars": {"n": "3"}}, {"name": "fact()", "vars": {"n": "2"}}, {"name": "fact()", "vars": {"n": "1"}}], "out": ""}, {"line": 3, "frames": [{"name": "全局", "vars": {"fact": "函数 fact"}}, {"name": "fact()", "vars": {"n": "3"}}, {"name": "fact()", "vars": {"n": "2"}}, {"name": "fact()", "vars": {"n": "1"}}], "out": ""}, {"line": 3, "frames": [{"name": "全局", "vars": {"fact": "函数 fact"}}, {"name": "fact()", "vars": {"n": "3"}}, {"name": "fact()", "vars": {"n": "2"}}, {"name": "fact()", "vars": {"n": "1"}}], "out": "", "ret": "1"}, {"line": 4, "frames": [{"name": "全局", "vars": {"fact": "函数 fact"}}, {"name": "fact()", "vars": {"n": "3"}}, {"name": "fact()", "vars": {"n": "2"}}], "out": "", "ret": "2"}, {"line": 4, "frames": [{"name": "全局", "vars": {"fact": "函数 fact"}}, {"name": "fact()", "vars": {"n": "3"}}], "out": "", "ret": "6"}, {"line": 7, "frames": [{"name": "全局", "vars": {"fact": "函数 fact", "r": "6"}}], "out": ""}, {"line": null, "frames": [{"name": "全局", "vars": {"fact": "函数 fact", "r": "6"}}], "out": "6\n"}]}, "notes": {"1": "定义递归函数：n 的阶乘 = n × (n-1) 的阶乘，1 的阶乘是 1。", "6": "调用 fact(3)。", "2": "n 是 1 吗？这是递归的“出口”，没有它就会无穷无尽地调用下去。", "3": "到达出口，返回 1。", "4": "fact(3) 要算 3 × fact(2)，于是又调用自己。注意右边一层层叠起来的 fact()，每一层都有自己的 n。", "7": "最终结果 3 × 2 × 1 = 6。"}}];
Stepper(document.getElementById("stepper"), PROGRAMS);
</script>
<script src="../common/sim.js"></script>
</body>
</html>
