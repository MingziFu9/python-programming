<h1>异常捕获流程</h1>
<div class="sub">12 个包子分给几个人？切换上面三组输入，点“下一步”，看程序在 try、except、else、finally 之间怎么走。橙色是下一步要执行的行。</div>
<div id="stepper"></div>

<script src="../common/stepper.js"></script>
<script>
// 以下数据由 tools/make_stepper_sim.py 根据 spec.json 真实运行代码生成，请勿手改
var PROGRAMS = [{"title": "输入 3（正常）", "trace": {"code": ["text = input(\"分给几个人：\")", "try:", "    n = int(text)", "    each = 12 / n", "except ValueError:", "    print(\"请输入整数\")", "except ZeroDivisionError:", "    print(\"人数不能为 0\")", "else:", "    print(\"每人分\", each, \"个\")", "finally:", "    print(\"分包子结束\")", "print(\"程序继续运行\")"], "steps": [{"line": 1, "frames": [{"name": "全局", "vars": {}}], "out": ""}, {"line": 2, "frames": [{"name": "全局", "vars": {"text": "'3'"}}], "out": "分给几个人：3\n"}, {"line": 3, "frames": [{"name": "全局", "vars": {"text": "'3'"}}], "out": "分给几个人：3\n"}, {"line": 4, "frames": [{"name": "全局", "vars": {"text": "'3'", "n": "3"}}], "out": "分给几个人：3\n"}, {"line": 10, "frames": [{"name": "全局", "vars": {"text": "'3'", "n": "3", "each": "4.0"}}], "out": "分给几个人：3\n"}, {"line": 12, "frames": [{"name": "全局", "vars": {"text": "'3'", "n": "3", "each": "4.0"}}], "out": "分给几个人：3\n每人分 4.0 个\n"}, {"line": 13, "frames": [{"name": "全局", "vars": {"text": "'3'", "n": "3", "each": "4.0"}}], "out": "分给几个人：3\n每人分 4.0 个\n分包子结束\n"}, {"line": null, "frames": [{"name": "全局", "vars": {"text": "'3'", "n": "3", "each": "4.0"}}], "out": "分给几个人：3\n每人分 4.0 个\n分包子结束\n程序继续运行\n"}]}, "notes": {"1": "输入的是字符串 \"3\"。", "2": "进入 try：下面的代码“试着做”，出了错不会让程序崩溃。", "3": "\"3\" 能转成整数 3。", "4": "12 / 3 = 4.0，也没有出错。", "10": "try 里一切正常，跳过所有 except，执行 else。", "12": "finally：无论有没有出错，都会执行。", "13": "程序继续往下运行。"}}, {"title": "输入 abc", "trace": {"code": ["text = input(\"分给几个人：\")", "try:", "    n = int(text)", "    each = 12 / n", "except ValueError:", "    print(\"请输入整数\")", "except ZeroDivisionError:", "    print(\"人数不能为 0\")", "else:", "    print(\"每人分\", each, \"个\")", "finally:", "    print(\"分包子结束\")", "print(\"程序继续运行\")"], "steps": [{"line": 1, "frames": [{"name": "全局", "vars": {}}], "out": ""}, {"line": 2, "frames": [{"name": "全局", "vars": {"text": "'abc'"}}], "out": "分给几个人：abc\n"}, {"line": 3, "frames": [{"name": "全局", "vars": {"text": "'abc'"}}], "out": "分给几个人：abc\n"}, {"line": 5, "frames": [{"name": "全局", "vars": {"text": "'abc'"}}], "out": "分给几个人：abc\n"}, {"line": 6, "frames": [{"name": "全局", "vars": {"text": "'abc'"}}], "out": "分给几个人：abc\n"}, {"line": 12, "frames": [{"name": "全局", "vars": {"text": "'abc'"}}], "out": "分给几个人：abc\n请输入整数\n"}, {"line": 13, "frames": [{"name": "全局", "vars": {"text": "'abc'"}}], "out": "分给几个人：abc\n请输入整数\n分包子结束\n"}, {"line": null, "frames": [{"name": "全局", "vars": {"text": "'abc'"}}], "out": "分给几个人：abc\n请输入整数\n分包子结束\n程序继续运行\n"}]}, "notes": {"1": "输入的是字符串 \"abc\"。", "2": "进入 try。", "3": "int(\"abc\") 转换失败，抛出 ValueError！try 里剩下的代码（第 4 行）不再执行，直接去找能处理它的 except。", "6": "执行 except 下面的代码，提示用户。", "12": "finally 照样执行。", "13": "程序没有崩溃，继续运行。", "5": "这个 except 接的正是 ValueError，匹配，异常被接住了。"}}, {"title": "输入 0", "trace": {"code": ["text = input(\"分给几个人：\")", "try:", "    n = int(text)", "    each = 12 / n", "except ValueError:", "    print(\"请输入整数\")", "except ZeroDivisionError:", "    print(\"人数不能为 0\")", "else:", "    print(\"每人分\", each, \"个\")", "finally:", "    print(\"分包子结束\")", "print(\"程序继续运行\")"], "steps": [{"line": 1, "frames": [{"name": "全局", "vars": {}}], "out": ""}, {"line": 2, "frames": [{"name": "全局", "vars": {"text": "'0'"}}], "out": "分给几个人：0\n"}, {"line": 3, "frames": [{"name": "全局", "vars": {"text": "'0'"}}], "out": "分给几个人：0\n"}, {"line": 4, "frames": [{"name": "全局", "vars": {"text": "'0'", "n": "0"}}], "out": "分给几个人：0\n"}, {"line": 5, "frames": [{"name": "全局", "vars": {"text": "'0'", "n": "0"}}], "out": "分给几个人：0\n"}, {"line": 7, "frames": [{"name": "全局", "vars": {"text": "'0'", "n": "0"}}], "out": "分给几个人：0\n"}, {"line": 8, "frames": [{"name": "全局", "vars": {"text": "'0'", "n": "0"}}], "out": "分给几个人：0\n"}, {"line": 12, "frames": [{"name": "全局", "vars": {"text": "'0'", "n": "0"}}], "out": "分给几个人：0\n人数不能为 0\n"}, {"line": 13, "frames": [{"name": "全局", "vars": {"text": "'0'", "n": "0"}}], "out": "分给几个人：0\n人数不能为 0\n分包子结束\n"}, {"line": null, "frames": [{"name": "全局", "vars": {"text": "'0'", "n": "0"}}], "out": "分给几个人：0\n人数不能为 0\n分包子结束\n程序继续运行\n"}]}, "notes": {"1": "输入的是字符串 \"0\"。", "2": "进入 try。", "3": "\"0\" 能转成整数 0。", "4": "12 / 0：除数为 0，抛出 ZeroDivisionError！", "8": "执行这里的代码，提示用户。", "12": "finally 照样执行。", "13": "程序继续运行。", "5": "这个 except 只接 ValueError，和 ZeroDivisionError 不匹配，继续往下找。", "7": "except ZeroDivisionError 匹配，异常被接住了。"}}];
Stepper(document.getElementById("stepper"), PROGRAMS);
</script>
