<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>词频统计：一词一词计出来</title>
<link rel="stylesheet" href="../common/sim.css">
</head>
<body>
<h1>词频统计：一词一词计出来</h1>
<div class="sub">点“下一步”或“自动播放”，看字典 counts 怎么一词一词长起来（浅黄色是刚变的）。重点看 counts.get(w, 0) 在“第一次见到”和“又见到”时分别得到什么。</div>
<div id="stepper"></div>

<script src="../common/stepper.js"></script>
<script>
// 以下数据由 tools/make_stepper_sim.py 根据 spec.json 真实运行代码生成，请勿手改
var PROGRAMS = [{"title": "词频统计", "trace": {"code": ["words = \"包子 很 香 老板 包子 香 包子\".split()", "counts = {}", "for w in words:", "    if w == \"很\":", "        continue", "    counts[w] = counts.get(w, 0) + 1", "print(counts)"], "steps": [{"line": 1, "frames": [{"name": "全局", "vars": {}}], "out": ""}, {"line": 2, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']"}}], "out": ""}, {"line": 3, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{}"}}], "out": ""}, {"line": 4, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{}", "w": "'包子'"}}], "out": ""}, {"line": 6, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{}", "w": "'包子'"}}], "out": ""}, {"line": 3, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 1}", "w": "'包子'"}}], "out": ""}, {"line": 4, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 1}", "w": "'很'"}}], "out": ""}, {"line": 5, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 1}", "w": "'很'"}}], "out": ""}, {"line": 3, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 1}", "w": "'很'"}}], "out": ""}, {"line": 4, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 1}", "w": "'香'"}}], "out": ""}, {"line": 6, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 1}", "w": "'香'"}}], "out": ""}, {"line": 3, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 1, '香': 1}", "w": "'香'"}}], "out": ""}, {"line": 4, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 1, '香': 1}", "w": "'老板'"}}], "out": ""}, {"line": 6, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 1, '香': 1}", "w": "'老板'"}}], "out": ""}, {"line": 3, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 1, '香': 1, '老板': 1}", "w": "'老板'"}}], "out": ""}, {"line": 4, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 1, '香': 1, '老板': 1}", "w": "'包子'"}}], "out": ""}, {"line": 6, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 1, '香': 1, '老板': 1}", "w": "'包子'"}}], "out": ""}, {"line": 3, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 2, '香': 1, '老板': 1}", "w": "'包子'"}}], "out": ""}, {"line": 4, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 2, '香': 1, '老板': 1}", "w": "'香'"}}], "out": ""}, {"line": 6, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 2, '香': 1, '老板': 1}", "w": "'香'"}}], "out": ""}, {"line": 3, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 2, '香': 2, '老板': 1}", "w": "'香'"}}], "out": ""}, {"line": 4, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 2, '香': 2, '老板': 1}", "w": "'包子'"}}], "out": ""}, {"line": 6, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 2, '香': 2, '老板': 1}", "w": "'包子'"}}], "out": ""}, {"line": 3, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 3, '香': 2, '老板': 1}", "w": "'包子'"}}], "out": ""}, {"line": 7, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 3, '香': 2, '老板': 1}", "w": "'包子'"}}], "out": ""}, {"line": null, "frames": [{"name": "全局", "vars": {"words": "['包子', '很', '香', '老板', '包子', '香', '包子']", "counts": "{'包子': 3, '香': 2, '老板': 1}", "w": "'包子'"}}], "out": "{'包子': 3, '香': 2, '老板': 1}\n"}]}, "notes": {"1": "split() 按空格把一句话拆成一个词的列表。", "2": "准备一个空字典，用来记“每个词出现了几次”。", "3": "依次取出每个词放进 w。", "4": "是“很”这种没有意义的词吗？", "5": "是，就跳过它，不计数。", "6": "核心一行：counts.get(w, 0) 查 w 现在的次数，第一次见到时查不到，得到 0；再加 1，存回 counts[w]。", "7": "全部统计完，显示结果：包子 3 次、香 2 次、老板 1 次。"}}, {"title": "取值、新增与修改", "trace": {"code": ["prices = {\"可乐\": 3.5, \"面包\": 5.5}", "print(prices[\"可乐\"])", "print(prices.get(\"雪碧\", 0))", "prices[\"牛奶\"] = 4.5", "prices[\"可乐\"] = 3.8", "print(prices)", "print(prices[\"雪碧\"])"], "steps": [{"line": 1, "frames": [{"name": "全局", "vars": {}}], "out": ""}, {"line": 2, "frames": [{"name": "全局", "vars": {"prices": "{'可乐': 3.5, '面包': 5.5}"}}], "out": ""}, {"line": 3, "frames": [{"name": "全局", "vars": {"prices": "{'可乐': 3.5, '面包': 5.5}"}}], "out": "3.5\n"}, {"line": 4, "frames": [{"name": "全局", "vars": {"prices": "{'可乐': 3.5, '面包': 5.5}"}}], "out": "3.5\n0\n"}, {"line": 5, "frames": [{"name": "全局", "vars": {"prices": "{'可乐': 3.5, '面包': 5.5, '牛奶': 4.5}"}}], "out": "3.5\n0\n"}, {"line": 6, "frames": [{"name": "全局", "vars": {"prices": "{'可乐': 3.8, '面包': 5.5, '牛奶': 4.5}"}}], "out": "3.5\n0\n"}, {"line": 7, "frames": [{"name": "全局", "vars": {"prices": "{'可乐': 3.8, '面包': 5.5, '牛奶': 4.5}"}}], "out": "3.5\n0\n{'可乐': 3.8, '面包': 5.5, '牛奶': 4.5}\n"}, {"line": null, "frames": [{"name": "全局", "vars": {"prices": "{'可乐': 3.8, '面包': 5.5, '牛奶': 4.5}"}}], "out": "3.5\n0\n{'可乐': 3.8, '面包': 5.5, '牛奶': 4.5}\n", "error": "KeyError: '雪碧'"}]}, "notes": {"1": "创建一个有两个键值对的字典。", "2": "用 [键] 取值，得到 3.5。", "3": "get 查一个不存在的键，不报错，返回给定的默认值 0。", "4": "给一个新的键赋值，就是新增。", "5": "给已有的键赋值，就是修改。", "6": "显示整个字典。", "7": "用 [键] 取一个不存在的键，报 KeyError，程序在这里停止。"}}];
Stepper(document.getElementById("stepper"), PROGRAMS);
</script>
<script src="../common/sim.js"></script>
</body>
</html>
