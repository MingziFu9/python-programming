# 第 2 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 2
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出整数、浮点数、字符串、布尔值、`None` 五种数据的写法和用途
  - 解释赋值语句“先算右边、再贴标签”的执行过程，以及 `input` 得到的为什么是字符串
  skill:
  - 计算含 `+ - * / // % ` 的表达式的结果，正确判断运算顺序
  - 编写用 `int`、`float` 转换输入、用 f-string 格式化输出的计算程序
  - 分析`TypeError`、`ValueError` 等类型相关报错的原因并改正
  quality:
  - 养成给变量起有意义名字、规范书写代码的习惯
  - 对计算结果保持核对意识，理解浮点数误差，不盲目相信输出
key_points:
- 变量：给数据贴标签
- 数字：整数与浮点数
- 字符串、布尔值与 None
- 运算符
difficulties:
- point: input 得到的是字符串，直接相加变成拼接
  solution: 现场演示输入 3 和 5 得到 35，再用 int() 改正，对比两种结果
- point: 赋值号 = 与数学中的等号含义不同
  solution: 用“贴标签”动画演示 x = x + 1 的执行过程，先算右边再贴标签
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 90
    content: 阅读网页教材第 2 章 变量、数据类型与运算的情景导入和第一节，操作交互动画“变量：给数据贴标签”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 10
    content: 情景导入：早上七点半，上班族排着队买早餐。一位顾客拿了 2 瓶可乐、3 个包子、1 盒牛奶，递过来一张 20 元。小周一边按计算器……
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 讲授与演示
    minutes: 5
    content: 2.1 变量：给数据贴标签：赋值语句、变量可以重新赋值、变量的命名规则
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“变量：给数据贴标签”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 理解变量就是给数据贴标签，会正确命名
  - name: 讲授
    minutes: 5
    content: 2.2 数字：整数与浮点数：两种数字、0.1 + 0.2 为什么不等于 0.3、round
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 认识整数和浮点数，知道浮点误差的原因和处理办法
  - name: 讲授
    minutes: 5
    content: 2.3 字符串、布尔值与 None：字符串、布尔值、None、用 type 查看类型
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 会用 type 查看类型，分清字符串、布尔值和 None
  - name: 讲授
    minutes: 5
    content: 2.4 运算符：算术运算符、运算顺序、复合赋值运算符
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 掌握运算符和运算顺序，能把小店算账问题写成表达式
  - name: 讲授
    minutes: 5
    content: 2.5 类型转换与 input：input 得到的永远是字符串、int、float、str 转换、eval
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 掌握 input 与类型转换，解决“35”问题
  - name: 讲授
    minutes: 5
    content: 2.6 f-string 格式化输出：在字符串里插入变量、格式说明
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 会用 f-string 输出整齐的结果
  - name: 拓展
    minutes: 5
    content: 2.7 前沿视窗：报错越来越友好
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 了解报错提示越来越友好，愿意读报错
  - name: 实验
    minutes: 2
    content: 实验 2-1 小店收银小票计算器
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 会用 `float`、`int` 把输入转换成数字，再进行计算；会用 f-string 把金额格式化成保留两位小数的形式
  - name: 实验
    minutes: 2
    content: 实验 2-2 单位换算与 BMI 计算
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 能把生活中的换算公式写成 Python 表达式；掌握 `/` 和 `**` 的用法以及运算顺序
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：读程序写结果。
- 简答题：找错并改正。下面的程序想算两件商品的总价，运行时报错，指出原因并改正。
- 简答题：为什么 `0.1 + 0.2 == 0.3` 的结果是 `False`？在收银程序中应该怎样处理？
- 实操题：写一个“鸡蛋装盒”程序：输入鸡蛋的个数，每盒装 10 个，输出能装满几盒、还剩几个。例如输入 47，输出“能装满 4 盒，还剩 7 个”。
- 实操题：写一个“会员积分”程序：输入消费金额（可以有小数），每消费 1 元积 1 分（不足 1 元的部分不积分），输出本次积分和“积分可抵扣金额”（100 分抵 1 元，保留两位小数）。例如消费 88.6 元，积 88 分，可抵扣 0.88 元。
- 实验报告：实验 2-1、实验 2-2、实验 2-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
