# 第 4 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 4
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出 6 个比较运算符和 `and`、`or`、`not` 的含义，以及哪些值会被当作“假”
  - 解释 if-else 两条路只走一条、if-elif-else 从上往下“遇到成立就停”的执行规则
  skill:
  - 使用 if、if-else、if-elif-else 和逻辑运算写出满减、阶梯电价、成绩等级等判断程序
  - 画出 简单的程序流程图，并把流程图翻译成代码
  - 找出 缩进错误、`=` 与 `==` 混用、条件顺序写反等常见错误，并改正
  quality:
  - 养成先画流程图、想清楚再写代码的工作习惯
  - 写判断条件时考虑边界和异常输入，培养严谨的态度
key_points:
- 比较运算与布尔表达式
- if 语句：让程序做选择
- 逻辑运算 and、or、not 与 in
- 先画流程图再写代码
difficulties:
- point: 多分支条件的顺序和边界值（如 >= 与 >）
  solution: 用会员折扣例子在流程图上逐个代入边界值，让学生手算后再运行验证
- point: 把 == 写成 =、条件后漏写冒号、缩进不一致
  solution: 集中展示 4.5 节的常见错误，让学生分组找错
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 90
    content: 阅读网页教材第 4 章 条件判断：让程序做选择的情景导入和第一节，操作交互动画“分支流程走一遍”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 10
    content: 情景导入：国庆节快到了，陈姐想搞一次促销：“满 100 元减 15 元，会员再打 9.5 折。”她让小周把这个规则加到收银程序里。……
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 讲授
    minutes: 5
    content: 4.1 比较运算与布尔表达式：六个比较运算符、比较字符串、连写的比较与小数比较
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 会写比较表达式，理解结果是布尔值
  - name: 讲授与演示
    minutes: 5
    content: 4.2 if 语句：让程序做选择：单分支 if、双分支 if-else、多分支 if-elif-else、一行写完的条件表达式
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“分支流程走一遍”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 掌握单分支、双分支和多分支 if 语句
  - name: 讲授
    minutes: 5
    content: 4.3 逻辑运算 and、or、not 与 in：and、or、not、优先级、in 和 not in、什么算“真”，什么算“假”
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 会用 and、or、not 和 in 组合条件
  - name: 讲授
    minutes: 5
    content: 4.4 先画流程图再写代码：流程图的基本符号、嵌套判断、先检查输入，再计算
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 能先画流程图再写嵌套判断，并先检查输入
  - name: 讲授
    minutes: 5
    content: 4.5 常见错误
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 认识常见错误，减少调试时间
  - name: 拓展
    minutes: 5
    content: 4.6 前沿视窗：AI 是怎样“做判断”的
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 了解 AI 分类本质上也是做判断
  - name: 实验
    minutes: 2
    content: 实验 4-1 满减与会员折扣计算
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 会把流程图翻译成两个先后执行的 if 语句；会用 if-else 在满足和不满足条件时给出不同的提示；会用 `strip
  - name: 实验
    minutes: 2
    content: 实验 4-2 阶梯电价计算
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 会用 if-elif-else 处理“分段计算”问题；能根据分段规则正确写出每一段的计算公式
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：读程序写结果。分别写出 `total` 为 260、300、99 时的输出。
- 简答题：找错并改正。下面的程序想实现“90 分及以上优秀、60 分及以上及格、60 分以下不及格”，有两处错误，请找出来并改正。
- 简答题：用自己的话说明：在什么情况下用几个独立的 if，什么情况下用 if-elif-else？各举一个小店里的例子。
- 实操题：输入一个年份，判断是否为闰年。规则：能被 4 整除但不能被 100 整除，或者能被 400 整除。用 2024、2025、1900、2000 测试。
- 实操题：小店开通了送货上门服务。运费规则：订单满 99 元免运费；不满 99 元时，重量 1 公斤以内 10 元，超过 1 公斤的部分每公斤加 3 元。输入重量和订单金额，输出运费（保留两位小数）。
- 实验报告：实验 4-1、实验 4-2、实验 4-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
