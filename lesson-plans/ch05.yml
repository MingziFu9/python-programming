# 第 5 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 5
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出 while 循环和 for 循环的写法，以及 `range` 三个参数的含义
  - 解释 break 和 continue 的区别，说出死循环产生的原因
  skill:
  - 使用 累加、计数、找最大值、输错重输、随机模拟五个套路解决小店里的重复计算问题
  - 画出 简单循环程序的变量追踪表，预测程序的输出
  - 使用 嵌套循环和 turtle 库画出简单图形
  quality:
  - 面对重复性工作，主动想到用程序提高效率
  - 调试时耐心单步执行、观察变量，培养解决问题的韧性
key_points:
- while 循环与计数器
- for 循环与 range
- break 与 continue
- 五个常用套路
difficulties:
- point: 循环变量的变化过程和循环何时结束
  solution: 用 Thonny 单步执行和变量窗口逐次观察，再让学生手写每一轮的变量表
- point: 累加、计数等套路中初始化放错位置
  solution: 对比把 total = 0 放在循环内外的两种结果，总结五个常用套路模板
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 90
    content: 阅读网页教材第 5 章 循环：让程序重复做事的情景导入和第一节，操作交互动画“循环追踪：变量一步步变化”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 10
    content: 情景导入：促销活动很成功，小店一天能卖一百多单。小周的收银程序有个大问题：每算完一单，程序就结束了，下一位顾客来了只能再点一次“运……
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 讲授
    minutes: 5
    content: 5.1 while 循环与计数器：while 的写法、计数器
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 掌握 while 循环和计数器写法
  - name: 讲授
    minutes: 5
    content: 5.2 for 循环与 range：for 循环、range、for 和 while 怎么选
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 掌握 for 与 range，知道两种循环怎么选
  - name: 讲授
    minutes: 5
    content: 5.3 break 与 continue
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 会用 break 和 continue 控制循环
  - name: 讲授与演示
    minutes: 5
    content: 5.4 五个常用套路：套路一、套路二、套路三、套路四等
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“循环追踪：变量一步步变化”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 熟练运用累加、计数、找最大值等套路
  - name: 讲授
    minutes: 5
    content: 5.5 嵌套循环
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 能读懂并写出简单的嵌套循环
  - name: 讲授
    minutes: 5
    content: 5.6 死循环怎么办：让程序停下来、用 Thonny 单步执行看变量
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 会停止死循环，会单步执行找错
  - name: 讲授
    minutes: 5
    content: 5.7 用 turtle 画图
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 用 turtle 画图提高兴趣，巩固循环
  - name: 拓展
    minutes: 5
    content: 5.8 前沿视窗：训练 AI 模型也是一个大循环
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 了解模型训练就是反复循环
  - name: 实验
    minutes: 2
    content: 实验 5-1 九九乘法表与一周对账汇总
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: '会用嵌套循环按“行、列”输出表格；会用累加和找最大值两个套路处理一周的营业额；会用 `end=""` 控制 print '
  - name: 实验
    minutes: 2
    content: 实验 5-2 猜数字游戏
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 会用 `random.randint` 生成随机整数；会用 while、break、continue 控制循环；会用“二
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：读程序写结果。
- 简答题：找错并改正。下面的程序想计算 1 + 2 + … + 100，有两处错误，请找出来并改正。
- 简答题：用自己的话说明 for 循环和 while 循环各适合什么情况，各举一个小店里的例子。
- 实操题：统计 1～100 中能被 7 整除的数有多少个，它们的和是多少。
- 实操题：写一个登录程序：密码是 `jf2026`，最多允许输入 3 次。输对显示“登录成功”；输错显示“密码错误，还剩 N 次机会”；3 次都错显示“错误次数太多，账户已锁定”。
- 实验报告：实验 5-1、实验 5-2、实验 5-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
