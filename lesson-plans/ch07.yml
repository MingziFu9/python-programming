# 第 7 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 7
online: 5
offline: 1
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出 字典“键值对”的写法和键的规则，以及集合的两个特点
  - 解释 `d[键]` 和 `d.get(键, 默认值)` 在键不存在时的区别
  skill:
  - 使用 字典完成按名称查价格、词频统计等任务，用 `items()` 遍历字典
  - 使用 集合去重，用交集、并集、差集比较两组数据
  - 选择 合适的数据类型（字符串、列表、元组、字典、集合）存放给定的数据
  quality:
  - 用词频统计分析顾客评价时，客观看待数据，不断章取义
  - 保护会员数据，示例中的姓名电话均为虚构
key_points:
- 字典：键值对
- 遍历字典与词频统计
- 字典和列表嵌套
- 集合：去重与交集、并集、差集
difficulties:
- point: 用不存在的键取值报 KeyError
  solution: 演示 in 判断和 get 方法两种写法，并让学生改写报错程序
- point: 字典与列表嵌套后取值层次多
  solution: 画出数据的层次结构图，一层一层写下标和键，配合 Thonny 变量窗口查看
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 90
    content: 阅读网页教材第 7 章 字典与集合：按名字找数据的情景导入和第一节，操作交互动画“词频统计：一词一词计出来”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 10
    content: 情景导入：新来的兼职店员小林第一天上班，顾客问：“酸奶多少钱？”小林翻出价目表，从第一行往下找：矿泉水、可乐、绿茶、鲜牛奶……找到……
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 讲授
    minutes: 5
    content: 7.1 字典：键值对：创建字典与取值、增加、修改与删除、get、键的规则
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 掌握字典的增删改查和 get
  - name: 讲授与演示
    minutes: 5
    content: 7.2 遍历字典与词频统计：keys、values、items、词频统计
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“词频统计：一词一词计出来”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 会遍历字典，完成词频统计
  - name: 讲授
    minutes: 5
    content: 7.3 字典和列表嵌套：一条记录是一个字典、一张表是字典的列表
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 会用字典列表表示一张表
  - name: 讲授
    minutes: 5
    content: 7.4 集合：去重与交集、并集、差集：创建集合与去重、交集、并集、差集
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 会用集合去重和求交并差
  - name: 讲授
    minutes: 5
    content: 7.5 怎么选：五种数据类型对比
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 能根据需要选择合适的数据类型
  - name: 拓展
    minutes: 5
    content: 7.6 前沿视窗：大模型的“词表”就是一本字典
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 了解大模型词表与字典的联系
  - name: 实验
    minutes: 2
    content: 实验 7-1 商品价格表与收银
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 会创建字典，用 `in` 判断键是否存在，用 `[键]` 取值；会用 `get` 累加数量，用 `items()` 遍历
  - name: 实验
    minutes: 2
    content: 实验 7-2 顾客评价词频统计
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 会用 `split()` 把文字拆成词，用字典和 `get` 统计词频；会用停用词列表过滤掉标点和没有意义的词；会对字典
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 135
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：读程序写结果。
- '简答题：找错并改正。下面的词频统计程序运行时报错 `KeyError: ''包子''`，为什么？怎么改？'
- 简答题：下面三份数据，分别用哪种数据类型存放最合适？说明理由。（1）全店 30 种商品的名称和售价，收银时要按名称查价格；（2）今天来过店里的会员编号，要知道一共来了多少位不同的会员；（3）一周 7 天的营业额，要按顺序画折线图。
- '实操题：输入一段文字，统计其中每个字出现的次数（例如输入“街坊街坊便利店”，输出 `{''街'': 2, ''坊'': 2, ''便'': 1, ''利'': 1, ''店'': 1}`）。'
- '实操题：已知成绩字典 `scores = {"周洋": 88, "黄敏": 95, "李娜": 72, "王强": 59}`（姓名为虚构），输出平均分、最高分的人和分数，以及不及格的名单。'
- 实验报告：实验 7-1、实验 7-2、实验 7-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
