# 第 12 章教案底稿，由 python tools/make_lesson_plan.py draft 生成。
# 改好“【待填】”的地方，删减或补充其他内容后运行 build。字段说明见 lesson-plans/README.md
chapter: 12
online: 4
offline: 2
methods:
- 讲授法
- 案例教学法
- 演示法
- 线上自主学习
- 实验教学法
objectives:
  knowledge:
  - 说出 一个 AI 应用从数据、模型到应用的基本流程，以及 API、API Key、提示词的含义
  - 解释 机器学习“用数据训练模型”和自己写规则的区别
  skill:
  - 使用 jieba 分词统计关键词，用 scikit-learn 训练一个简单的文本分类模型
  - 使用 requests 调用大模型接口，从回复的 JSON 中取出内容，并处理常见错误
  - 合作完成 一个由多个模块组成的小项目，并能判断编程和使用 AI 时的做法是否合法、合规
  quality:
  - 遵守个人信息保护法，不把真实个人数据发给大模型
  - 按规定标识 AI 生成的内容，形成负责任使用 AI 的态度
key_points:
- 从数据到模型到应用
- 文本分析与机器学习体验
- 调用大模型接口
- 团队开发：从想法到程序
difficulties:
- point: API Key 和请求、响应的结构
  solution: 用课堂模拟服务演示一次完整请求，配合交互动画逐项讲解请求和返回的 JSON
- point: 把多个功能组合成一个完整项目
  solution: 按团队分工拆成模块，先跑通最小版本，再逐步增加功能
process:
- phase: 课前（线上）
  steps:
  - name: 自主预习
    minutes: 72
    content: 阅读网页教材第 12 章 Python 与人工智能：综合项目的情景导入和第一节，操作交互动画“大模型接口：一次请求与回复”
    teacher: 在学习平台发布预习任务和预习问题
    student: 阅读教材、观看课件，在讨论区提出疑问
    intent: 带着问题进课堂
- phase: 课中（线下面授 / 直播）
  steps:
  - name: 情景导入
    minutes: 10
    content: '情景导入：一个学期下来，小周已经为街坊便利店写了不少小程序：收银、会员查询、销售日报、月度图表……陈姐很满意，又提出了新的想法：

      ……'
    teacher: 讲述情景，提出本章要解决的问题
    student: 思考并回答问题，说出自己的经验
    intent: 联系工作和生活场景，激发学习兴趣
  - name: 讲授
    minutes: 5
    content: 12.1 从数据到模型到应用：让程序“变聪明”的三种办法、AI 应用的基本流程
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 理解从数据到模型到应用的流程
  - name: 讲授
    minutes: 5
    content: 12.2 文本分析与机器学习体验：jieba 中文分词、三步训练一个分类模型
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 体验分词和三步训练分类模型
  - name: 讲授与演示
    minutes: 5
    content: 12.3 调用大模型接口：API、API Key 与 token、用 requests 发送请求、换成真实的大模型
    teacher: 讲解要点，结合例子和“算一算”演示；用交互动画“大模型接口：一次请求与回复”课堂演示
    student: 听讲、跟着计算、操作动画并回答提问
    intent: 会用 requests 调用大模型接口，保管好 API Key
  - name: 讲授
    minutes: 5
    content: 12.4 团队开发：从想法到程序
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 体验团队开发流程，完成综合项目
  - name: 讲授
    minutes: 5
    content: 12.5 编程伦理与法律
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 了解编程相关的伦理与法律
  - name: 拓展
    minutes: 5
    content: 12.6 前沿视窗：AI 编程智能体
    teacher: 讲解要点，结合例子和“算一算”演示
    student: 听讲、跟着计算、记录要点
    intent: 了解 AI 编程智能体的发展
  - name: 实验
    minutes: 25
    content: 实验 12-1 统计顾客评价的关键词
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 会用 jieba 对中文分词；会去掉停用词，用字典统计词频并排序；会根据统计结果给出简单的经营建议
  - name: 实验
    minutes: 25
    content: 实验 12-2 让大模型写本周经营小结
    teacher: 演示关键步骤，巡视指导，收集常见错误
    student: 按步骤完成实验，填写记录表
    intent: 会用 pandas 把一周的数据整理成文字，写出清楚的提示词；会用 requests 发送请求、从回复的 JSON 中取
  - name: 课堂练习
    minutes: 10
    content: 课后练习中的单选、判断题（在线作答，共 16 题，选做）
    teacher: 组织学生在网页上作答，讲评错误率高的题
    student: 在线作答，查看解析
    intent: 即时检验学习效果
  - name: 小结
    minutes: 5
    content: 用本章知识导图回顾要点，预告下一章
    teacher: 带领学生梳理知识导图
    student: 复述本章要点
    intent: 形成知识结构
- phase: 课后（线上）
  steps:
  - name: 课后巩固
    minutes: 108
    content: 完成本章课后练习（在线作答 16 题，简答 / 实操 5 题），提交实验报告
    teacher: 批改作业和实验报告，在讨论区答疑
    student: 完成练习，错题点“回看”复习对应小节
    intent: 巩固知识，形成技能
homework:
- 简答题：读程序写结果。
- '简答题：找错并改正。小周写了 `answer = result["choices"]["message"]["content"]`，运行时报错 `TypeError: list indices must be integers or slices, not str`，为什么？怎么改？'
- 简答题：陈姐想把全部会员的姓名、手机号和消费记录发给在线大模型，让它分析“哪些会员可能流失”。请你从个人信息保护的角度给她提两条建议。
- 实操题：已知差评短语有“排队太久”“有时候缺货”“价格有点贵”“店里有点挤”“冷饮不够冰”“晚上没有面包了”。编程统计 `labs/data/reviews.txt` 中每种差评短语各出现在几条评价中，以及含有任一差评短语的评价共有几条。
- 实操题：给小店管理助手的 sales.py 增加一个函数 `product_summary(df, name)`，返回某商品全年的销量（件）和销售额，商品不存在时返回 None；在 main.py 中增加菜单项 5 调用它。
- 实验报告：实验 12-1、实验 12-2、实验 12-3
assessment: 课堂练习正确率、课后作业和实验报告计入平时成绩
reflection: ''
