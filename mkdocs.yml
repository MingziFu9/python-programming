# 站点名、描述、网址和 nav 由 python tools/course.py sync 根据 course.yml 生成，请改 course.yml，不要手改这几项
site_name: Python 编程
site_description: 面向成人教育人工智能技术应用专业（专科）的《Python 编程》教材，零基础起步，12 章 36 个动手实验
site_url: https://mingzifu9.github.io/python-programming/
repo_url: https://github.com/MingziFu9/python-programming
docs_dir: docs
theme:
  name: material
  language: zh
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - abbr
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true
extra_css:
  - css/extra.css
extra_javascript:
  - javascripts/mathjax.js
  - javascripts/book.js
  - javascripts/tryit.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js
nav:
  - 首页: index.md
  - 课程描述: course-description.md
  - "第 1 章 初识 Python：搭好环境，写出第一个程序": chapters/01-getting-started/index.md
  - "第 2 章 变量、数据类型与运算": chapters/02-variables/index.md
  - "第 3 章 字符串：处理文字信息": chapters/03-strings/index.md
  - "第 4 章 条件判断：让程序做选择": chapters/04-conditions/index.md
  - "第 5 章 循环：让程序重复做事": chapters/05-loops/index.md
  - "第 6 章 列表与元组：批量管理数据": chapters/06-lists/index.md
  - "第 7 章 字典与集合：按名字找数据": chapters/07-dicts/index.md
  - "第 8 章 函数：把代码打包复用": chapters/08-functions/index.md
  - "第 9 章 文件读写与异常处理": chapters/09-files/index.md
  - "第 10 章 模块、第三方库与面向对象入门": chapters/10-modules-oop/index.md
  - "第 11 章 数据处理初体验：NumPy、pandas 与 Matplotlib": chapters/11-data-libs/index.md
  - "第 12 章 Python 与人工智能：综合项目": chapters/12-ai-project/index.md
  - 交互动画:
    - sims/index.md
    - "程序是怎么运行的": sims/run-program/index.md
    - "变量：给数据贴标签": sims/variable-labels/index.md
    - "字符串切片尺": sims/slice-ruler/index.md
    - "分支流程走一遍": sims/branch-flow/index.md
  - 学习图谱: learning-graph/index.md
  - 常见问题: faq/index.md
  - "期末模拟卷": mock-exam.md
  - 证书考点对照: certificate.md
  - 附录:
    - "附录 A 编程环境安装与常见问题": appendix/a-environment.md
    - "附录 B 常用内置函数与方法速查": appendix/b-reference.md
    - "附录 C 常见报错速查表": appendix/c-errors.md
    - "附录 D 术语表": appendix/glossary.md
